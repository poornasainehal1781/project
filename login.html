<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPL Login Page</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: linear-gradient(to bottom right, #0033cc, #00aaff);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #fff;
        }

        .login-container {
            background-color: rgba(0, 0, 0, 0.8);
            padding: 40px;
            width: 100%;
            max-width: 400px;
            border-radius: 15px;
            box-shadow: 0px 0px 20px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .logo {
            width: 150px;
            margin: 20px auto;
        }

        .login-container h2 {
            font-size: 2rem;
            margin-bottom: 20px;
            color: #ffc107;
        }

        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .form-group label {
            font-weight: bold;
            font-size: 0.9rem;
            display: block;
            margin-bottom: 5px;
            color: #ffc107;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 8px;
            outline: none;
            font-size: 1rem;
            color: #333;
        }

        .form-group input[type="text"],
        .form-group input[type="password"] {
            background-color: #f5f5f5;
        }

        .login-btn {
            background-color: #ff6a00;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            margin-top: 20px;
            transition: background 0.3s;
        }

        .login-btn:hover {
            background-color: #ff007a;
        }

        .forgot-password {
            margin-top: 10px;
            display: block;
            color: #ffc107;
            text-decoration: none;
        }

        .signup-link {
            color: #ffc107;
            font-weight: bold;
            text-decoration: underline;
            cursor: pointer;
        }

    </style>
</head>
<body>
    <div class="login-container">
        <img src="images/ipl-logo.png" alt="IPL Logo" class="logo">
        <h2>Welcome to IPL Fan Shop</h2>
        <form action="index.html">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Enter your username">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password">
            </div>
            <button type="submit" class="login-btn">Login</button>
        </form>
        <a href="#" class="forgot-password">Forgot Password?</a>
        <p style="margin-top: 20px;">Don't have an account? <span class="signup-link">Sign up</span></p>
    </div>
</body>
</html>

<!DOCTYPE html>

    <link rel="stylesheet" href="style.css">
    <style>
        .body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f8f9fa;
            color: #333;
        }

        h1 {
            margin-top: 20px;
        }

        .teams-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 80%;
            max-width: 600px;
            justify-content: center;
            align-items: center;
        }

        .team-button {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            border-radius: 8px;
            color: white;
            text-decoration: none;
            font-size: 1.5rem;
            font-weight: bold;
            transition: transform 0.3s;
            gap: 30px;
        }

        .team-button img {
            width: 50px;
            height: 50px;
            margin-right: 15px;
            border-radius: 50%;
        }

        .team-button:hover {
            transform: scale(1.05);
        }

        /* Team-specific styles */
        .team1 {
            background-color: #FECB00;
            /* Change color for each team */
        }

        .team2 {
            background-color: #004BA0;
        }

        .team3 {
            background-color: #DA1A27;
        }

        .team4 {
            background-color: #EA1A8E;
        }

        .team5 {
            background-color: #F95B26;
        }

        .team6 {
            background-color: #001C9A;
        }

        .team7 {
            background-color: #1748A2;
        }

        .team8 {
            background-color: #3A225D;
        }

        .team9 {
            background-color: #1C1E2A;
        }

        .team10 {
            background-color: #D71920;
        }

        /* Adjust button size for better visibility */
        .team-button {
            width: 100%;
        }
    </style>
</head>
